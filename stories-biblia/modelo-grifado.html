<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans:wght@600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ===== Modelo "Grifado": página da Bíblia em close, com o trecho marcado =====
     Cara de foto espontânea: luz baixa, tons vinho / cereja / castanho / couro, foco raso,
     capa de couro e corte das folhas avermelhado. Nenhum texto por cima da foto. */
  :root {
    --W: 1080px; --H: 1920px;
    --papel: #F2EADC; --tinta: #251D19; --tinta-suave: #5E504A;
    /* marca-texto (padrão: vinho) */
    --mt: rgba(140,20,45,.44); --mt-borda: rgba(110,10,35,.5);
    /* marca */
    --capa: #4A1A16; --corte: #8E2A26;
  }
  body.cereja    { --mt: rgba(210,36,70,.40);  --mt-borda: rgba(180,20,55,.45); }
  body.castanho  { --mt: rgba(168,70,40,.42);  --mt-borda: rgba(140,52,28,.45); }
  body.vermelho  { --mt: rgba(225,45,45,.38);  --mt-borda: rgba(195,25,30,.42); }
  body.vinho     { }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: #000; }
  body.pinterest { --W: 1000px; --H: 1500px; }

  #palco { position: absolute; inset: 0; overflow: hidden; }
  .camada { position: absolute; inset: 0; }

  /* ---------- superfície onde a Bíblia está ---------- */
  .superficie { position: absolute; inset: -80px; }
  .superficie::before, .superficie::after { content: ""; position: absolute; inset: 0; }
  /* veludo vinho: dobras grandes e brilho suave */
  body.veludo .superficie { background: #4E0E18; }
  body.veludo .superficie::before { mix-blend-mode: soft-light; opacity: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='1400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.0022 .0045' numOctaves='3' seed='11'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncR type='gamma' exponent='1.6' amplitude='1.4'/><feFuncG type='gamma' exponent='1.6' amplitude='1.4'/><feFuncB type='gamma' exponent='1.6' amplitude='1.4'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); background-size: 1400px 1400px; }
  body.veludo .superficie::after { mix-blend-mode: overlay; opacity: .35;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  /* couro (marrom avermelhado) */
  body.couro .superficie { background: radial-gradient(80% 60% at 70% 30%, #6A2A1E, #3A1410 75%); }
  body.couro .superficie::before { mix-blend-mode: multiply; opacity: .55;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='500'><filter id='n'><feTurbulence type='turbulence' baseFrequency='.045' numOctaves='3' seed='8'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  body.couro .superficie::after { background: radial-gradient(40% 25% at 75% 20%, rgba(255,210,190,.18), rgba(0,0,0,0) 70%); }
  /* madeira escura avermelhada */
  body.madeira .superficie { background: #3A1C13; }
  body.madeira .superficie::before { mix-blend-mode: soft-light; opacity: .9;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.002 .07' numOctaves='3' seed='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* ---------- a Bíblia ---------- */
  .mundo { position: absolute; inset: 0; perspective: 2000px; }
  .livro { position: absolute; transform-style: preserve-3d; font-size: var(--f, 40px); }
  .capa { position: absolute; inset: -.6em -.9em -.6em -.3em; border-radius: .35em; transform: translateZ(-1.5em);
          background: linear-gradient(115deg, #5A231C, var(--capa) 45%, #2E0F0C);
          box-shadow: 0 1.4em 3em rgba(10,0,0,.6); }
  .capa::after { content: ""; position: absolute; inset: .28em; border-radius: .25em; border: 1px dashed rgba(200,150,120,.25); }
  .folha { position: absolute; inset: 0; background: var(--corte); border-right: 1px solid rgba(40,5,5,.35); border-bottom: 1px solid rgba(40,5,5,.35); }

  .pagina { position: relative; width: 36.8em; height: 80em; background: var(--papel); overflow: hidden;
            padding: 2.4em 1.9em 0 2.6em; color: var(--tinta); font-family: 'Crimson Pro', serif; }
  /* textura do papel + sombra da lombada (à esquerda) */
  .pagina::before { content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none; mix-blend-mode: multiply; opacity: .9;
    background:
      linear-gradient(90deg, rgba(60,25,15,.34) 0, rgba(60,25,15,.12) 2.5%, rgba(60,25,15,0) 9%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='3' seed='2'/><feColorMatrix type='matrix' values='0 0 0 0 .85  0 0 0 0 .78  0 0 0 0 .7  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .cabeco { position: absolute; top: 1.05em; left: 2.6em; right: 1.9em; display: flex; justify-content: space-between;
            font-family: 'Open Sans', sans-serif; font-weight: 700; font-size: .56em; letter-spacing: .06em; color: var(--tinta); }
  .colunas { position: relative; z-index: 2; display: flex; gap: 1.7em; height: 100%; }
  .col { width: 15.3em; flex-shrink: 0; font-size: 1em; line-height: 1.3; text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
  .col + .col { border-left: 1px solid rgba(40,30,20,.18); padding-left: 1.7em; margin-left: -1.7em; width: 17em; }
  .col p { text-indent: .9em; }
  .col sup { font-family: 'Open Sans', sans-serif; font-weight: 700; font-size: .5em; vertical-align: .75em; line-height: 0; margin-right: .18em; letter-spacing: -.02em; }
  .sc { font-variant: small-caps; letter-spacing: .02em; }
  .titulo-secao { font-family: 'Open Sans', sans-serif; font-weight: 800; font-size: .74em; line-height: 1.25; margin: .9em 0 .35em; text-indent: 0 !important; }
  .sobrescrito { font-style: italic; text-indent: 0 !important; color: var(--tinta-suave); }
  .cap { float: left; font-family: 'Open Sans', sans-serif; font-weight: 800; font-size: 2.6em; line-height: .82; margin: .04em .12em -.05em 0; }
  .transparencia { position: absolute; inset: 0; z-index: 1; transform: scaleX(-1) translateY(.65em); opacity: .03; filter: blur(1.2px); pointer-events: none; }
  .transparencia .colunas { padding: 2.4em 1.9em 0 2.6em; }
  /* marca-texto: riscos com borda irregular, por cima do texto (multiplica) */
  .marcas { position: absolute; inset: 0; z-index: 3; pointer-events: none; mix-blend-mode: multiply; filter: url(#aspero); }
  .traco-margem { position: absolute; background: rgba(122,20,38,.85); border-radius: 999px; }
  .risco { position: absolute; background: var(--mt); border-radius: .18em .32em .26em .2em; }
  .risco::after { content: ""; position: absolute; right: -.05em; top: 8%; bottom: 8%; width: .38em; border-radius: 50%; background: var(--mt-borda); filter: blur(1.5px); }


  /* citação 1: cabeçalho da página com o livro e o número do capítulo em evidência */
  .cabeco-cap { text-indent: 0; margin: .1em 0 .8em; font-family: 'Open Sans', sans-serif; color: var(--tinta); line-height: 1; }
  .cabeco-cap .nome { font-weight: 700; font-size: .82em; letter-spacing: .32em; text-transform: uppercase; display: flex; gap: .9em; align-items: baseline; }
  .cabeco-cap .versao { font-weight: 700; font-size: .92em; letter-spacing: .22em; color: var(--tinta-suave); }
  .cabeco-cap .versao::before { content: '·'; margin-right: .9em; }
  .cabeco-cap .num { font-weight: 800; font-size: 3.3em; letter-spacing: -.01em; margin-top: .08em; }
  .cabeco-cap::after { content: ""; display: block; margin-top: .3em; border-bottom: 1px solid rgba(40,30,20,.35); }
  body.cit-cabecalho .cabeco .rh { visibility: hidden; }

  /* ---------- acabamento da foto ---------- */
  #foto img { position: absolute; inset: 0; width: 100%; height: 100%; }
  body.tom-vinho  #foto { filter: sepia(.15) saturate(1.06) contrast(1.06) brightness(.94); }
  body.tom-quente #foto { filter: sepia(.18) saturate(.92) contrast(1.02); }
  body.tom-pb     #foto { filter: grayscale(1) contrast(1.08) brightness(.97); }
  /* luz baixa: foco claro no trecho, bordas caindo para vinho escuro */
  #luz { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply;
         background: radial-gradient(ellipse 78% 46% at var(--fx, 50%) var(--fy, 50%), rgba(255,255,255,1) 22%, rgba(150,80,72,1) 70%, rgba(70,16,20,1) 100%); opacity: var(--escuro, .62); }
  #tinta { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; background: radial-gradient(ellipse 80% 50% at var(--fx, 50%) var(--fy, 50%), rgba(150,60,50,.12) 30%, rgba(130,20,35,.55) 100%); }
  body.tom-pb #tinta, body.tom-quente #tinta { display: none; }
  #grao { position: absolute; inset: 0; pointer-events: none; opacity: .3; mix-blend-mode: overlay;
          background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='5' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  body.cru #luz, body.cru #tinta, body.cru #grao, body.cru #cita, body.cru #seta-cita { visibility: hidden; }
  /* citação 2 e 3: etiqueta por cima da foto, com seta desenhada à mão */
  #cita { position: absolute; z-index: 10; white-space: nowrap; display: none; }
  #cita.caixinha { display: block; background: rgba(243,234,223,.95); color: #5E1621; font-family: 'EB Garamond', serif; font-size: 40px; letter-spacing: .02em;
                   padding: 8px 24px 12px; border-radius: 12px; box-shadow: 0 6px 22px rgba(30,5,5,.35); }
  #cita.mao { display: block; color: #F6EBDD; font-family: 'Caveat', cursive; font-weight: 600; font-size: 66px; line-height: 1;
              text-shadow: 0 1px 12px rgba(30,5,5,.7), 0 0 2px rgba(30,5,5,.5); }
  #seta-cita { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 10; overflow: visible; filter: drop-shadow(0 1px 5px rgba(30,5,5,.55)); }


  /* áreas livres (iguais ao modelo de livros) */
  .safe { position: absolute; top: 250px; bottom: 250px; left: 150px; right: 150px; pointer-events: none; }
  body.tiktok .safe { top: 150px; bottom: 450px; }
  body.pinterest .safe { top: 100px; bottom: 100px; left: 110px; right: 110px; }
  body.pinterest-vertical .safe { top: 270px; bottom: 440px; left: 195px; right: 195px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="aspero" x="-5%" y="-20%" width="110%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".035 .09" numOctaves="2" seed="4" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="palco">
  <div class="camada" id="cena">
    <div class="superficie"></div>
    <div class="mundo">
      <div class="livro">
        <div class="capa"></div>
        <div class="folhas"></div>
        <div class="pagina">
          <div class="cabeco"><span class="rh"></span><span class="pg"></span></div>
          <div class="transparencia"></div>
          <div class="colunas"><div class="col c1"></div><div class="col c2"></div></div>
          <div class="marcas"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="camada" id="foto"></div>
  <div id="tinta"></div>
  <div id="luz"></div>
  <div id="grao"></div>
</div>
<div class="safe"></div>
<div id="cita"></div>
<svg id="seta-cita" width="0" height="0"></svg>

<script>
// Gerador pseudoaleatório fixo (o mesmo pedido gera sempre a mesma imagem)
function rnd(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const senhor = h => h.replace(/\bSENHOR\b/g, '<span class="sc">Senhor</span>').replace(/\bDEUS\b/g, '<span class="sc">Deus</span>');

// Monta o HTML do trecho conforme o "jeito":
//   "grifo"  (padrão em trecho curto): trecho todo em foco, grifo nas frases de "grifo" (sem "grifo" = trecho todo grifado)
//   "traco"  (padrão em trecho longo = jeito B): trecho todo em foco + traço na margem + grifo nas frases de "grifo"
//   "tudo"   (carta na manga A): trecho todo grifado
// Se o "texto" já vier com <span class="mt"> ou <span class="foco">, é usado como está.
// Trecho longo = 4 versículos ou mais, ou mais de 300 letras.
function prepararTexto(cfg) {
  const t = cfg.texto;
  if (/class="(mt|foco)"/.test(t)) return t;
  const versos = (t.match(/<sup>/g) || []).length, letras = t.replace(/<[^>]+>/g, '').length;
  const jeito = cfg.jeito || (versos >= 4 || letras > 300 ? 'traco' : 'grifo');
  const frases = [].concat(cfg.grifo || []);
  const envolver = (cls) => t.replace(/<p([^>]*)>([\s\S]*?)<\/p>/g, (_, a, dentro) => `<p${a}><span class="${cls}">${dentro}</span></p>`);
  if (jeito === 'tudo' || (jeito === 'grifo' && !frases.length)) return envolver('mt');
  let h = envolver('foco');
  for (const fr of frases) {
    // a frase pode atravessar o número de um versículo: aceita <sup>n</sup> entre as palavras
    const rx = new RegExp(fr.trim().split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('(?:\\s|<sup>\\d+</sup>)+'));
    if (!rx.test(h)) throw new Error('frase para grifar não encontrada no trecho: ' + fr);
    h = h.replace(rx, m => `<span class="mt">${m}</span>`);
  }
  if (jeito === 'grifo' && cfg.traco === undefined) cfg.traco = false;
  return h;
}

window.montar = async (cfg, MAX, MIN, PISO) => {
  cfg.texto = prepararTexto(cfg);
  const B = document.body;
  const citacao = cfg.citacao || 'nenhuma';
  const ref = (cfg.referencia || '').match(/^(.*\S)\s+(\d+)(?::(\S+))?$/) || [];
  B.className = ['cru', 'cit-' + citacao, 'tom-' + (cfg.tom || 'vinho'), cfg.plataforma || 'instagram', cfg.cor || 'vinho', cfg.superficie || 'veludo'].join(' ');
  const W = innerWidth, H = innerHeight;
  const livro = document.querySelector('.livro'), pag = document.querySelector('.pagina');
  const c1 = document.querySelector('.c1'), c2 = document.querySelector('.c2');
  document.querySelector('.rh').textContent = (cfg.cabecalho || '').toUpperCase();
  document.querySelector('.pg').textContent = cfg.pagina || '';

  // coluna da esquerda: texto anterior (desfocado); coluna da direita: contexto + trecho + continuação
  c1.innerHTML = senhor(cfg.outraColuna || cfg.antes || '');
  const cabCap = citacao === 'cabecalho' && ref[1] ? `<div class="cabeco-cap"><div class="nome"><span>${ref[1]}</span><span class="versao">${cfg.versao || ''}</span></div><div class="num">${ref[2]}</div></div>` : '';
  c2.innerHTML = cabCap + senhor((cfg.antes || '') + (cfg.titulo ? `<p class="titulo-secao">${cfg.titulo}</p>` : '') + cfg.texto + (cfg.depois || ''));
  for (const c of [c1, c2]) for (let i = 0; i < 10 && c.scrollHeight < pag.clientHeight * 1.1; i++) c.insertAdjacentHTML('beforeend', senhor((c === c2 ? cfg.depois || cfg.outraColuna : cfg.outraColuna || cfg.depois) || cfg.antes || ''));
  document.querySelector('.transparencia').innerHTML = `<div class="colunas"><div class="col">${c2.innerHTML.replace(/<div class="cabeco-cap">[\s\S]*?<\/div><\/div>/, '')}</div><div class="col">${c1.innerHTML}</div></div>`;

  // espessura do miolo (corte avermelhado)
  const fl = document.querySelector('.folhas'); fl.innerHTML = '';
  for (let i = 1; i <= 24; i++) { const d = document.createElement('div'); d.className = 'folha'; d.style.transform = `translateZ(${-i * 0.055}em)`; d.style.filter = `brightness(${1 - i * .012})`; fl.appendChild(d); }


  const safe0 = document.querySelector('.safe').getBoundingClientRect();
  const reserva = (citacao === 'caixinha' || citacao === 'mao') ? (cfg.reservaCitacao ?? 190) : 0;
  const safe = { left: safe0.left, right: safe0.right, top: safe0.top + reserva, bottom: safe0.bottom, width: safe0.width, height: safe0.height - reserva };
  const alvo = { x: safe.left + safe.width * (cfg.focoX ?? .46), y: safe.top + safe.height * (cfg.focoY ?? .5) };
  const rz = cfg.giro ?? -16, rx = cfg.inclinacao ?? 24, ry = cfg.lado ?? -9;
  const mts = () => [...document.querySelectorAll('.c2 .foco, .c2 .mt')];   // define o foco e o enquadramento
  const grifos = () => [...document.querySelectorAll('.c2 .mt')];            // só estes recebem marca-texto
  const alvos = () => [...document.querySelectorAll('.c2 .cabeco-cap'), ...mts()];  // enquadramento e foco (inclui o cabeçalho do capítulo)
  await document.fonts.ready;

  const cabeNaPagina = () => {
    livro.style.transform = 'none';
    const P = pag.getBoundingClientRect(), ult = mts().at(-1).getBoundingClientRect();
    return ult.bottom <= P.bottom - 4 * parseFloat(livro.style.fontSize || 40);
  };
  livro.style.fontSize = MAX + 'px';
  const cabEl = document.querySelector('.c2 .cabeco-cap');
  if (cabEl) for (let g = 0; g < 30; g++) {
    livro.style.transform = 'none';
    const ini = mts()[0].getClientRects()[0], fimCab = cabEl.getBoundingClientRect().bottom, el = cabEl.nextElementSibling;
    if (ini.top - fimCab <= MAX * 1.3 * (cfg.linhasAntes ?? 2.2) || !el || el.matches('.mt, .foco') || el.querySelector('.mt, .foco')) break;
    el.remove();
  }
  while (!cabeNaPagina() && !cabEl && c2.firstElementChild && !c2.firstElementChild.querySelector('.mt, .foco') && !c2.firstElementChild.matches('.mt, .foco')) c2.firstElementChild.remove();
  // verso da folha (transparência) montado depois dos cortes, para não mostrar o que saiu da página
  document.querySelector('.transparencia').innerHTML = `<div class="colunas"><div class="col">${c2.innerHTML.replace(/<div class="cabeco-cap">[\s\S]*?<\/div><\/div>/, '')}</div><div class="col">${c1.innerHTML}</div></div>`;

  const posicionar = (f) => {
    livro.style.fontSize = f + 'px';
    livro.style.transform = 'none'; livro.style.left = '0px'; livro.style.top = '0px';
    const P = pag.getBoundingClientRect();
    const textoEsq = c2.getBoundingClientRect().left + parseFloat(getComputedStyle(c2).paddingLeft) - P.left;   // medido com a página reta
    const rs = mts().flatMap(m => [...m.getClientRects()]);
    const ra = alvos().flatMap(m => [...m.getClientRects()]);
    const rg = grifos().flatMap(m => [...m.getClientRects()]);
    const x0 = Math.min(...ra.map(r => r.left)), x1 = Math.max(...ra.map(r => r.right));
    const y0 = Math.min(...ra.map(r => r.top)), y1 = Math.max(...ra.map(r => r.bottom));
    const o = { x: (x0 + x1) / 2 - P.left, y: (y0 + y1) / 2 - P.top };
    livro.style.transformOrigin = `${o.x}px ${o.y}px`;
    livro.style.left = (alvo.x - o.x) + 'px'; livro.style.top = (alvo.y - o.y) + 'px';
    document.querySelector('.mundo').style.perspectiveOrigin = `${alvo.x}px ${alvo.y}px`;
    livro.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
    const bx = alvos().map(m => m.getBoundingClientRect());
    const b = { l: Math.min(...bx.map(r => r.left)), r: Math.max(...bx.map(r => r.right)), t: Math.min(...bx.map(r => r.top)), b: Math.max(...bx.map(r => r.bottom)) };
    const loc = r => ({ l: r.left - P.left, t: r.top - P.top, w: r.width, h: r.height });
    return { rs: rg.map(loc), rf: rs.map(loc), textoEsq, b,
             cabe: b.l >= safe.left - 2 && b.r <= safe.right + 2 && b.t >= safe.top - 2 && b.b <= safe.bottom + 2 };
  };
  let f = MAX, m = posicionar(f);
  while (!m.cabe && f > PISO) { f--; m = posicionar(f); }

  // riscos do marca-texto (linha a linha, levemente tortos)
  const R = rnd([...cfg.texto].reduce((a, c) => a * 31 + c.charCodeAt(0), 7));
  const mk = document.querySelector('.marcas'); mk.innerHTML = '';
  const linhas = [];
  for (const r of m.rs) { const l = linhas.find(x => Math.abs(x.t - r.t) < r.h * .5); if (l) { l.r = Math.max(l.r, r.l + r.w); l.l = Math.min(l.l, r.l); } else linhas.push({ l: r.l, r: r.l + r.w, t: r.t, h: r.h }); }
  for (const l of linhas) {
    const d = document.createElement('div'); d.className = 'risco';
    const ex = f * (.08 + R() * .12), al = l.h * .80;
    d.style.cssText = `left:${l.l - f * .1}px;top:${l.t + (l.h - al) * .62}px;width:${l.r - l.l + f * .1 + ex}px;height:${al}px;transform:rotate(${(R() - .5) * .7}deg)`;
    mk.appendChild(d);
  }

  // traço na margem (padrão quando há <span class="foco">; ou com "traco": true): caneta vinho no vão entre as colunas,
  // do começo ao fim do trecho em foco. Feito com segmentos de <div> (SVG grande desalinha dentro da página em 3D).
  if (cfg.traco ?? !!document.querySelector('.c2 .foco')) {
    const top = Math.min(...m.rf.map(r => r.t)) + f * .3, bot = Math.max(...m.rf.map(r => r.t + r.h)) - f * .55;
    const x = m.textoEsq - f * .6, n = Math.max(2, Math.round((bot - top) / (f * 4)));
    const pts = Array.from({ length: n + 1 }, (_, k) => ({ x: x + (R() - .5) * f * .07, y: top + (bot - top) * k / n }));
    const esp = f * .1;
    for (let k = 0; k < n; k++) {
      const p0 = pts[k], p1 = pts[k + 1], L = Math.hypot(p1.x - p0.x, p1.y - p0.y) + esp * .6, ang = Math.atan2(p1.x - p0.x, p1.y - p0.y);
      const d = document.createElement('div'); d.className = 'traco-margem';
      d.style.cssText = `left:${p0.x - esp / 2}px;top:${p0.y - esp * .3}px;width:${esp}px;height:${L}px;transform-origin:50% 0;transform:rotate(${-ang}rad)`;
      mk.appendChild(d);
    }
  }

  document.getElementById('cena').style.display = '';
  document.getElementById('foto').innerHTML = '';
  const fy = (m.b.t + m.b.b) / 2, fx = (m.b.l + m.b.r) / 2;
  B.style.setProperty('--fx', fx + 'px'); B.style.setProperty('--fy', fy + 'px');
  B.style.setProperty('--escuro', cfg.escuro ?? .55);
  const rgI = document.createRange(), tn = document.createTreeWalker(mts()[0], NodeFilter.SHOW_TEXT).nextNode();
  rgI.setStart(tn, 0); rgI.setEnd(tn, 1); const ri = rgI.getBoundingClientRect();
  window.__foco = { y: fy, meia: (m.b.b - m.b.t) / 2, f, desf: cfg.desfoque ?? 1, H, caixa: m.b, inicio: { x: ri.left, y: ri.top },
                    citacao, textoCita: cfg.referencia ? cfg.referencia + (cfg.versao ? ' · ' + cfg.versao : '') : '', safe0 };

  return { fonte: f, cabe: m.cabe };
};

// 2a etapa: a cena nítida vira foto e ganha profundidade de campo progressiva.
// O desfoque cresce aos poucos conforme se afasta do trecho: várias camadas, cada uma um pouco mais nítida,
// com transições largas e sobrepostas. O desfoque é feito em canvas com as bordas estendidas (sem bordas claras).
function desfocar(img, b, W, H) {
  const o = document.createElement('canvas'); o.width = W; o.height = H;
  const ctx = o.getContext('2d');
  if (!b) { ctx.drawImage(img, 0, 0, W, H); return o; }
  const p = Math.ceil(b * 3), c = document.createElement('canvas'); c.width = W + 2 * p; c.height = H + 2 * p;
  const x = c.getContext('2d');
  x.drawImage(img, p, p, W, H);
  x.drawImage(img, 0, 0, W, 1, p, 0, W, p);              // topo
  x.drawImage(img, 0, H - 1, W, 1, p, H + p, W, p);      // base
  x.drawImage(c, p, 0, 1, H + 2 * p, 0, 0, p, H + 2 * p);          // esquerda
  x.drawImage(c, W + p - 1, 0, 1, H + 2 * p, W + p, 0, p, H + 2 * p); // direita
  ctx.filter = `blur(${b}px)`; ctx.drawImage(c, -p, -p);
  return o;
}
// máscara vertical em canvas: opaco na faixa [y-ini, y+ini], some até [y-fim, y+fim]
function mascarar(cv, y, ini, fim, H) {
  const pts = [[y - fim, 0], [y - ini, 1], [y + ini, 1], [y + fim, 0]];
  const a = v => { if (v <= pts[0][0] || v >= pts[3][0]) return 0; for (let k = 0; k < 3; k++) { const [x0, a0] = pts[k], [x1, a1] = pts[k + 1]; if (v <= x1) return x1 === x0 ? a1 : a0 + (a1 - a0) * (v - x0) / (x1 - x0); } return 0; };
  const t = cv.getContext('2d'), g = t.createLinearGradient(0, 0, 0, H);
  const pos = [0, ...pts.map(p => p[0]).filter(v => v > 0 && v < H), H];
  for (const v of pos) g.addColorStop(v / H, `rgba(0,0,0,${a(v)})`);
  t.globalCompositeOperation = 'destination-in'; t.fillStyle = g; t.fillRect(0, 0, cv.width, H);
}
window.finalizar = async (src) => {
  const { y, meia, f, desf, H } = window.__foco;
  const W = innerWidth;
  const foto = document.getElementById('foto'); foto.innerHTML = '';
  const img = new Image(); img.src = src; await img.decode();
  const NIVEIS = [11, 8.5, 6.5, 4.8, 3.4, 2.2, 1.2, .5, 0].map(b => b * desf);   // do mais desfocado ao nítido
  const h0 = meia + f * .35;                // faixa totalmente nítida em volta do trecho
  const L = (H * .27) / NIVEIS[0];          // distância (px) por px de desfoque: chega ao máximo ~520 px depois do trecho
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const o = out.getContext('2d');
  for (let i = 0; i < NIVEIS.length; i++) {
    const b = NIVEIS[i], cv = desfocar(img, b, W, H);
    if (i > 0) mascarar(cv, y, h0 + b * L, h0 + NIVEIS[i - 1] * L, H);
    o.drawImage(cv, 0, 0);
  }
  out.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
  foto.appendChild(out);
  document.getElementById('cena').style.display = 'none';
  document.body.classList.remove('cru');
  desenharCitacao();
};

function desenharCitacao() {
  const F = window.__foco, el = document.getElementById('cita'), sv = document.getElementById('seta-cita');
  el.className = ''; sv.innerHTML = ''; sv.setAttribute('width', 0);
  if (F.citacao !== 'caixinha' && F.citacao !== 'mao') return;
  el.className = F.citacao; el.textContent = F.textoCita;
  const w0 = el.getBoundingClientRect().width;
  el.style.left = Math.max(F.safe0.left + 4, Math.min(F.safe0.right - w0, F.inicio.x - 40)) + 'px';
  el.style.top = Math.max(F.safe0.top + 6, F.inicio.y - (F.citacao === 'mao' ? 175 : 165)) + 'px';
  const L = el.getBoundingClientRect();
  const a = { x: L.left + 30, y: L.bottom + 12 };
  const z = { x: F.inicio.x - 12, y: F.inicio.y - 6 };
  const c = { x: Math.min(a.x, z.x) - 60, y: (a.y + z.y) / 2 + 10 };
  const ang = Math.atan2(z.y - c.y, z.x - c.x), k = 24;
  const p1 = { x: z.x - k * Math.cos(ang - .45), y: z.y - k * Math.sin(ang - .45) }, p2 = { x: z.x - k * Math.cos(ang + .45), y: z.y - k * Math.sin(ang + .45) };
  sv.setAttribute('width', innerWidth); sv.setAttribute('height', innerHeight);
  sv.innerHTML = `<path d="M${a.x} ${a.y} Q ${c.x} ${c.y} ${z.x} ${z.y} M${p1.x} ${p1.y} L${z.x} ${z.y} L${p2.x} ${p2.y}" fill="none" stroke="#F6EBDD" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>`;
}

// mapa das zonas (só para referência): áreas reservadas por rede + onde o trecho grifado precisa caber
window.mapa = (MIN) => {
  const add = (css, html, cls = '') => { const d = document.createElement('div'); d.className = 'm ' + cls; d.style.cssText = css; d.innerHTML = html || ''; document.body.appendChild(d); };
  const st = document.createElement('style');
  st.textContent = `.m{position:absolute;font-family:'Open Sans';font-weight:700;box-sizing:border-box;z-index:20}
    .z{background:rgba(230,80,80,.22);border:3px dashed rgba(255,120,120,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:28px;line-height:1.35;text-shadow:0 1px 6px rgba(0,0,0,.6)}
    .lat{background:rgba(70,130,220,.16);border-left:3px dashed rgba(120,170,255,.85);border-right:3px dashed rgba(120,170,255,.85)}
    .box{border:3px dashed}
    .tag{color:#fff;font-size:22px;padding:4px 12px;border-radius:6px;white-space:nowrap}
    .cota{color:#BFD6FF;font-size:22px;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.7)}`;
  document.head.appendChild(st);
  const safe = document.querySelector('.safe').getBoundingClientRect(), lat = Math.round(safe.left), H = innerHeight;
  const tt = document.body.classList.contains('tiktok'), pv = document.body.classList.contains('pinterest-vertical'), pin = document.body.classList.contains('pinterest');
  const T = Math.round(safe.top), Bs = Math.round(H - safe.bottom);
  const sub = t => `<br><span style="font-weight:400;font-size:24px">${t}</span>`;
  add(`left:0;right:0;top:0;height:${T}px`, `TOPO RESERVADO · ${T} px` + sub(tt ? 'abas Seguindo / Para você · busca' : pv ? 'fechar · perfil · botões do topo' : pin ? 'botões Salvar e menu' : 'nome do perfil · barra de progresso'), 'z');
  add(`left:0;right:0;bottom:0;height:${Bs}px`, `BASE RESERVADA · ${Bs} px` + sub(tt ? 'nome · legenda · música · barra de navegação' : pv ? 'título · descrição · Salvar · comentários' : pin ? 'ícone de busca visual' : 'caixa de resposta · curtir · enviar'), 'z');
  add(`left:0;width:${lat}px;top:${T}px;bottom:${Bs}px`, '', 'lat');
  add(`right:0;width:${lat}px;top:${T}px;bottom:${Bs}px`, '', 'lat');
  if (tt || pv) add(`right:12px;width:${lat - 24}px;top:${T + 560}px;height:${H - Bs - T - 560}px;background:rgba(230,80,80,.22);border:3px dashed rgba(255,120,120,.85);border-radius:12px;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3`, pv ? 'botões<br>reagir<br>comentar<br>compartilhar' : 'botões<br>curtir<br>comentar<br>salvar<br>compartilhar');
  add(`left:20px;top:${tt ? 900 : pv ? 1000 : 1080}px;transform:rotate(-90deg);transform-origin:left top`, `margem lateral · ${lat} px`, 'cota');
  const b = window.__foco.caixa;
  add(`left:${b.l - 10}px;top:${b.t - 10}px;width:${b.r - b.l + 20}px;height:${b.b - b.t + 20}px;border-color:rgb(80,200,120)`, '', 'box');
  add(`left:${b.l - 10}px;top:${b.t - 52}px;background:rgb(50,160,90)`, `TRECHO GRIFADO · nítido · letra ${MIN}–50 px`, 'tag');
  add(`left:${b.l - 10}px;top:${b.b + 22}px;background:rgba(120,40,50,.95)`, 'daqui para fora, o desfoque aumenta aos poucos', 'tag');
};
