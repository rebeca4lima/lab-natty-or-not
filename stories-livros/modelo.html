<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #3A322B; --tinta-suave: #8C8178; --linha: rgba(58,50,43,.16);
    --destaque: rgba(247,176,196,.55); --barra: #EFA9BF;
    --card: #FFFFFF; --card-texto: #2E2924; --card-icone: #3A3A3A; --card-linha: #ECE8E3;
    --blend: multiply;
  }
  body.azul    { --destaque: rgba(160,200,240,.55); --barra: #9EC3EA; }
  body.verde   { --destaque: rgba(178,226,190,.55); --barra: #A3D6B0; }
  body.lilas   { --destaque: rgba(205,185,240,.55); --barra: #BFA9E8; }
  body.amarelo { --destaque: rgba(250,226,140,.6);  --barra: #EFD27A; }
  body.preto   { --barra: #2B2622; }
  /* app em modo escuro */
  body.escuro  { --card: #121212; --card-texto: #ECE6DE; --card-icone: #E8E8E8; --card-linha: #2A2A2A;
                 --destaque: rgba(214,112,150,.42); --blend: normal; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; background: #F9F6F0 url(fundo.png); color: var(--tinta);
         position: relative; overflow: hidden; font-family: 'Open Sans', sans-serif; }

  .safe { position: absolute; top: 250px; bottom: 250px; left: 150px; right: 150px; display: flex; flex-direction: column; }
  /* TikTok: topo 150 px (abas/busca), base 450 px (nome, legenda, música); laterais iguais (150 px cobrem a coluna de botões) */
  body.tiktok .safe { top: 150px; bottom: 450px; }
  /* Pinterest: pin 1000x1500 (2:3); 100 px livres em cima (botões Salvar/menu) e embaixo (busca visual); laterais 110 px (o Pinterest não cobre as laterais) */
  body.pinterest { width: 1000px; height: 1500px; background-position: center; }
  body.pinterest .safe { top: 100px; bottom: 100px; left: 110px; right: 110px; }
  /* Pinterest vertical (estilo story): 1080x1920; topo 270, base 440, laterais 195 px (coluna de botões à direita) */
  body.pinterest-vertical .safe { top: 270px; bottom: 440px; left: 195px; right: 195px; }
  .area { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }

  /* "print" do app */
  .app { width: 100%; height: 100%; background: var(--card); border-radius: 0; overflow: hidden;
         box-shadow: 0 18px 50px rgba(70,50,30,.14), 0 2px 8px rgba(70,50,30,.06); display: flex; flex-direction: column; }
  .barra-app { display: flex; align-items: center; padding: 30px 40px 26px; border-bottom: 2px solid var(--card-linha); }
  .barra-app svg { width: 40px; height: 40px; stroke: var(--card-icone); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .barra-app .dir { margin-left: auto; display: flex; gap: 46px; }
  .conteudo { flex: 1; padding: 40px 52px 36px; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; }
  .citacao { border-left: 8px solid var(--barra); border-radius: 2px; padding: 4px 0 4px 36px; color: var(--card-texto); }
  .citacao p { font-size: 42px; line-height: 1.55; }
  .citacao p + p { margin-top: .7em; }
  .progresso { margin: 0 56px 40px; height: 5px; border-radius: 3px; background: var(--card-linha); position: relative; }
  .progresso::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 62%; border-radius: 3px; background: var(--barra); }

  .mt { background: var(--destaque); padding: .04em .12em; margin: 0 -.06em; border-radius: .35em .2em .4em .25em;
        -webkit-box-decoration-break: clone; box-decoration-break: clone; mix-blend-mode: var(--blend); }

  .divisor { width: 520px; height: 2px; background: var(--linha); margin: 44px auto 40px; flex-shrink: 0; }
  .livro { display: flex; align-items: center; justify-content: center; gap: 34px; flex-shrink: 0; }
  .livro img { width: 150px; border-radius: 5px; box-shadow: 0 8px 20px rgba(60,40,20,.2); }
  .titulo { font-weight: 700; font-size: 38px; }
  .autor { font-size: 33px; color: var(--tinta-suave); margin-top: 6px; }
</style>
</head>
<body>
  <div class="safe">
    <div class="area">
      <div class="app">
        <div class="barra-app">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          <div class="dir">
            <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </div>
        </div>
        <div class="conteudo">
          <div class="citacao" id="texto">
            <p>Não sou apenas “o meu lado” em um conflito. <span class="mt">Sou mais do que a soma dos meus preconceitos, do meu partido e de minhas ideias preconcebidas.</span> Meus pensamentos não são predeterminados por minha família, minha cultura ou minha empresa.</p>
          </div>
        </div>
        
      </div>
    </div>
    <div class="divisor"></div>
    <div class="livro">
      <img id="capa" src="capas/a-terceira-alternativa.jpg" alt="">
      <div>
        <div class="titulo" id="titulo">A terceira alternativa</div>
        <div class="autor" id="autor">Stephen R. Covey</div>
      </div>
    </div>
  </div>
</body>
</html>
